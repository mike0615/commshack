name: CommShack checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y php-cli shellcheck
      - name: PHP syntax and behavior
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find plugins themes tests -name '*.php' -print0)
          php tests/plugin-test.php
      - name: Installer boundaries and syntax
        run: |
          shellcheck -x scripts/*.sh packaging/*.sh tests/*.sh build.sh install.sh
          sudo bash tests/deploy-test.sh
